# main에 올리면 GitHub Pages로 자동 배포한다.
#   /      랜딩 페이지 (landing/)
#   /play/ 허브와 게임 (index (1).html → index.html 로 바꿔 복사, shinip/)
# 사이트 폴더는 release/build_release.py 가 만든다. 원본 파일은 고치지 않는다.
# 저장소 Settings → Pages → Source 를 "GitHub Actions"로 한 번 설정해 두어야 한다.
name: Pages 배포

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 진행 규칙·저장·금지 문자열 검사
        run: node tests/logic.test.js

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 사이트 폴더 만들기 (site/)
        run: python release/build_release.py site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
